# Project specific configuration for clausthal.
# Only properties that differ from MyCoRe, MIR or reposis_common defaults are listed here.
# Empty values differ between test and production or are confidential and must be set via Ansible inventory.

##############################################################################
# Basic                                                                      #
##############################################################################
# Base URL, e.g. https://domain without trailing '/'
MCR.baseurl=

# Base URL for canonical links on metadata pages, e.g. https://domain/
MIR.CanonicalBaseURL=

MCR.NameOfProject=Clausthal
MIR.projectid.default=clausthal

##############################################################################
# Email                                                                      #
##############################################################################
MCR.Mail.Server=

# General sender mail address, e.g. mail@domain
MCR.Mail.Sender=

# Sender mail for events, e.g. <name> mail@domain
MCR.mir-module.MailSender=

# Mail for events including self registration, e.g. <name> mail@domain
MCR.mir-module.EditorMail=

##############################################################################
# Access Control                                                             #
##############################################################################
# Disable access keys, MIR enables them for mods
MCR.ACL.AccessKey.Strategy.AllowedObjectTypes=

# Rules of mir_access take precedence over state, MIR uses state first
MIR.Access.Strategy.Classifications=mir_access,state

##############################################################################
# DOI                                                                        #
##############################################################################
MCR.DOI.Prefix=10.21268
MCR.DOI.HostingInstitution=Universit\u00E4tsbibliothek der TU Clausthal

# Service is disabled until Datacite credentials are configured
#MCR.PI.Service.Datacite=org.mycore.pi.doi.MCRDOIService
MCR.PI.Service.Datacite.Transformer=datacite
MCR.PI.Service.Datacite.RegistrationPredicate=org.mycore.pi.condition.MCRPIPublishedPredicate
MCR.PI.Service.Datacite.RegisterBaseURL=%MCR.baseurl%
MCR.PI.Service.Datacite.Username=
MCR.PI.Service.Datacite.Password=
MCR.PI.Service.Datacite.Generator=DateDOI
MCR.PI.Service.Datacite.MetadataService=MODSDOI

# DOIs like 10.21268/20261123-0
MCR.PI.Generator.DateDOI=org.mycore.pi.MCRGenericPIGenerator
MCR.PI.Generator.DateDOI.Type=doi
MCR.PI.Generator.DateDOI.GeneralPattern=%MCR.DOI.Prefix%/$ObjectDate-$Count
MCR.PI.Generator.DateDOI.DateFormat=yyyyMMdd

# Only DOIs with the own prefix are handled by the DOI service
MCR.PI.MetadataService.MODSDOI.Prefix=%MCR.DOI.Prefix%

##############################################################################
# URN                                                                        #
##############################################################################
# URNs like urn:nbn:de:gbv:104-20261123-00000-2
MCR.PI.Generator.TypeYearCountURN.Namespace=urn:nbn:de:gbv:104-
MCR.PI.Generator.TypeYearCountURN.GeneralPattern=%MCR.PI.Generator.TypeYearCountURN.Namespace%$ObjectDate-$Count-
MCR.PI.Generator.TypeYearCountURN.DateFormat=yyyyMMdd

##############################################################################
# OAI                                                                        #
##############################################################################
MCR.OAIDataProvider.OAI2.RepositoryName=Publikationsserver der TU Clausthal
MCR.OAIDataProvider.OAI2.AdminEmail=
MCR.OAIDataProvider.OAI2.RecordSampleID=%MIR.projectid.default%_mods_00000321

# Keep URL format, changing it changes all OAI identifiers
MCR.OAIDataProvider.OAI2.RepositoryIdentifier=

MCR.OAIDataProvider.OAI2.DescriptionURI.EPrints=webapp:oai/oai-eprints.xml
MCR.OAIDataProvider.OAI2.DescriptionURI.Rights=webapp:oai/oai-rights.xml

MCR.OAIDataProvider.OAI2.Friends.DBThueringen=https://www.db-thueringen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DuEPublico=https://duepublico.uni-duisburg-essen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.OpenAgrar=https://www.openagrar.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.RosDok=https://rosdok.uni-rostock.de/oai

# Publisher in xMetaDissPlus
MCR.OAIDataProvider.RepositoryPublisherName=Technische Universit\u00E4t Clausthal
MCR.OAIDataProvider.RepositoryPublisherPlace=Clausthal-Zellerfeld
MCR.OAIDataProvider.RepositoryPublisherAddress=Adolph-Roemer-Stra\u00DFe 2A

# Journals and series hosted by the repository, marked as hosted in xMetaDissPlus
MIR.HostedPeriodicals.List=zimport_mods_00000280,zimport_mods_00000282,zimport_mods_00000283,zimport_mods_00000284,\
  zimport_mods_00000286,zimport_mods_00000288,zimport_mods_00000285,clausthal_mods_00000082

# Add oai_datacite, MIR also offers marcxml
MCR.OAIDataProvider.OAI2.MetadataFormats=oai_dc,mods,epicur,oai_datacite,xMetaDissPlus
MCR.OAIDataProvider.MetadataFormat.oai_datacite.Namespace=http://schema.datacite.org/oai/oai-1.0/
MCR.OAIDataProvider.MetadataFormat.oai_datacite.Schema=http://schema.datacite.org/oai/oai-1.0/oai_datacite.xsd

# Add xmetadissplus and urn sets for the DNB harvesting, MIR also offers institute
MCR.OAIDataProvider.OAI2.Sets=doc-type,open_access,openaire,driver,ec_fundedresources,GENRE,ddc,xmetadissplus,urn

# Published records with Clausthal URN (urn:nbn:de:gbv:104-) and files, except video, research data, journals and series
MCR.OAIDataProvider.OAI2.Sets.xmetadissplus=webapp:oai/set_xmetadissplus.xml
MCR.OAIDataProvider.OAI2.MapSetToQuery.xmetadissplus=derCount:[1 TO *] AND NOT(mods.type:video OR mods.type:research_data OR mods.type:journal OR mods.type:series) AND state:published AND objectType:mods AND mods.identifier:urn* AND mods.identifier:*104-* AND mods.identifier:*gbv*

# Records with Clausthal URN (urn:nbn:de:gbv:104-)
MCR.OAIDataProvider.OAI2.Sets.urn=webapp:oai/set_urn.xml
MCR.OAIDataProvider.OAI2.MapSetToQuery.urn=mods.identifier:urn* AND mods.identifier:*104-* AND mods.identifier:*gbv*

# Use DINI 2022 publication types, MIR still uses diniPublType
MIR.xMetaDissPlus.diniPublType.classificationId=diniPublType2022
MIR.dc.diniPublType.classificationId=diniPublType2022
MIR.dc.ignoredClassificationIds=diniPublType
MCR.OAIDataProvider.OAI2.Sets.doc-type.Classification=diniPublType2022
MCR.OAIDataProvider.OAI2.Sets.doc-type.URI=xslStyle:classification2sets:classification:metadata:2:children:diniPublType2022

##############################################################################
# Editor                                                                     #
##############################################################################
# The agreement include (reposis_common) must be loaded before the customization, which overrides its template
MIR.EditorForms.CustomIncludes=%MIR.EditorForms.CustomIncludes%,\
  xslStyle:editor/mir2xeditor:webapp:editor/editor-agreement-customization.xed,\
  xslStyle:editor/mir2xeditor:webapp:editor/editor-customization.xed

##############################################################################
# Frontend                                                                   #
##############################################################################
MIR.CustomLayout.JS=clausthal.js

# Add series-layout of mir-navigation-plugin
MIR.Layout.End=mir-edit,series-layout,mir-citation,mir-thumbnail,mir-epusta,mir-access-rights,mir-export,mir-admindata,mir-historydata

# Render the series panel of mir-navigation-plugin in MyCoReWebPage, the plugin does not register it
MCR.URIResolver.xslIncludes.MyCoReWebPage=%MCR.URIResolver.xslIncludes.MyCoReWebPage%,series-panel-enricher.xsl,series-panel-adapter.xsl

MIR.Metadata.Navigation.SeriesPanel.RSS.Enabled=false

# ePuSta is disabled until the endpoint is configured
#MIR.ePuSta=show
MIR.ePuSta.providerURL=

# ReCaptcha for contact form and self registration, disabled if empty
MIR.ReCaptcha.site.key=
MIR.ReCaptcha.secret.key=

##############################################################################
# Agreement                                                                  #
##############################################################################
# Sends a mail to MIR.Agreement.MailTo when a submitter accepts the agreement (reposis_common)
MCR.EventHandler.MCRObject.019j.Class=de.gbv.reposis.agreement.VZGMailAgreementEventHandler

# Recipient of the agreement mail, MCR.mir-module.EditorMail if empty
MIR.Agreement.MailTo=

# Terms attached to the mail, a complete URL is used because the web folder is not reachable behind the WAF
# Hosted on production only, test uses it too
MIR.Agreement.File.URL=https://dokumente.ub.tu-clausthal.de/api/v2/objects/clausthal_mods_00002878/derivates/clausthal_derivate_00002552/contents/Vertragsbedingungen%20zur%20Ver%C3%B6ffentlichung%20auf%20dem%20Publikationsserver%20der%20TU%20Clausthal.pdf

# Links shown in the editor, the terms are hosted on production only, test uses them too
Clausthal.Agreement.FormURL=https://www.ub.tu-clausthal.de/fileadmin/Sites/Bibliothek/Documents/Anmeldeformular_zur_Ver%C3%B6ffentlichung_auf_dem_Publikationsserver_der_TU_ClausthalFERTIG.pdf
Clausthal.Agreement.TermsURL=https://dokumente.ub.tu-clausthal.de/receive/clausthal_mods_00002868
